<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="1.5; url=https://discord.gg/hndGTbyA92">
  <meta name="robots" content="noindex">
  <title>DruxtJS &middot; Taking you to Discord</title>
  <style>
    :root {
      --bg: #1c2733;
      --bg-edge: #16202a;
      --text: #e5ecf1;
      --muted: #9db2c2;
      --link: #53b0eb;
      --link-hover: #8ccbf3;
      --green: #41b883;
      --rule: #33465a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      background: radial-gradient(115% 115% at 50% 0%, var(--bg) 0%, var(--bg-edge) 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px;
      -webkit-font-smoothing: antialiased;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 420px;
    }
    .logo { width: 76px; height: auto; display: block; }

    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.35;
      text-wrap: balance;
    }

    p.sub {
      font-size: 15px;
      line-height: 1.55;
      color: var(--muted);
    }
    a { color: var(--link); }
    a:hover { color: var(--link-hover); }

    .invite {
      display: inline-block;
      margin-top: 4px;
      padding: 12px 28px;
      background: var(--green);
      color: #0c1720;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      border-radius: 6px;
    }
    .invite:hover { background: #5ac897; color: #0c1720; }

    .invite:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 3px;
    }

    .bar {
      width: 180px;
      height: 3px;
      border-radius: 2px;
      background: var(--rule);
      overflow: hidden;
      margin-top: 8px;
    }

    .bar span {
      display: block;
      height: 100%;
      width: 100%;
      background: var(--green);
      transform-origin: left;
      animation: fill 1.5s linear forwards;
    }

    @keyframes fill {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bar span { animation: none; }
    }

    footer {
      position: absolute;
      bottom: 28px;
      font-size: 13px;
      color: var(--muted);
    }
    footer a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--rule); }
    footer a:hover { color: var(--text); }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 452 342" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DruxtJS">
      <path d="M139 330l-1-2c-2-4-2-8-1-13H29L189 31l67 121 22-16-67-121c-1-2-9-14-22-14-6 0-15 2-22 15L5 303c-1 3-8 16-2 27 4 6 10 12 24 12h136c-14 0-21-6-24-12z" fill="#3498DB"/>
      <path d="M447 304L317 70c-2-2-9-15-22-15-6 0-15 3-22 15l-17 28v54l39-67 129 230h-49a23 23 0 0 1-2 14l-1 1c-6 11-21 12-23 12h76c3 0 17-1 24-12 3-5 5-14-2-26z" fill="#108775"/>
      <path d="M376 330v-1l1-2c1-4 2-8 1-12l-4-12-102-178-15-27h-1l-15 27-102 178-4 12a24 24 0 0 0 2 15c4 6 10 12 24 12h190c3 0 18-1 25-12zM256 152l93 163H163l93-163z" fill="#E5ECF1"/>
    </svg>
    <h1>Taking you to the DruxtJS Discord</h1>
    <p class="sub">You&rsquo;ll be redirected in a moment. If nothing happens, use the invite link below.</p>
    <a class="invite" href="https://discord.gg/hndGTbyA92">Open the Discord invite</a>
    <div class="bar" aria-hidden="true"><span></span></div>
  </main>
  <footer>A <a href="https://druxtjs.org">druxtjs.org</a> property &middot; discord.gg/hndGTbyA92</footer>
</body>
</html>

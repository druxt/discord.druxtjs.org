image: node:lts

stages:
  - deploy

# Was: GitLab Pages via RealityLoop's self-hosted instance (git.realityloop.com),
# custom Pages domain realityloop.pages.rl.cm. That infra was decommissioned and the
# lapsed rl.cm domain got picked up by a domain-parking service — see
# druxt/workspace wiki page "Discord Community" for the incident writeup.
#
# Requires masked CI/CD variables NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID (Settings >
# CI/CD > Variables on this project). Netlify's own git integration can't reach an
# internal-only gitlab.local instance, so deploys go via netlify-cli instead.
deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npx --yes netlify-cli deploy --prod --dir=public --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
